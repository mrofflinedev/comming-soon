<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@mrofflinedev | Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --border: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            padding: 2rem;
        }

        .container {
            max-width: 700px;
            width: 100%;
            text-align: center;
            margin: auto;
            padding: 3rem 2rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 0 50px var(--accent-glow);
        }

        /* Logo Styling */
        .logo-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            background: var(--accent-glow);
            border: 2px solid var(--accent);
            border-radius: 50%;
            font-family: 'Fira Code', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 1.5rem;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .presents {
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.75rem;
            opacity: 0.9;
        }

        h1 {
            font-size: clamp(1.8rem, 3.5vw, 2.5rem);
            font-weight: 800;
            margin-bottom: 1.5rem;
            letter-spacing: -0.025em;
            min-height: 3.5rem; /* Prevents layout shifting during typing */
        }

        h1 span.typed-text {
            color: var(--accent);
            border-right: 2px solid var(--accent);
            padding-right: 4px;
            animation: blink 0.75s infinite;
        }

        @keyframes blink {
            0% { border-color: var(--accent); }
            50% { border-color: transparent; }
            100% { border-color: var(--accent); }
        }

        p {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        /* Countdown Grid Styles */
        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        .time-box {
            background: rgba(17, 24, 39, 0.6);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 10px;
        }

        .time-box span {
            display: block;
            font-family: 'Fira Code', monospace;
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .time-box label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Form Styles */
        form {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        input[type="email"] {
            flex: 1;
            padding: 0.85rem 1rem;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="email"]:focus {
            border-color: var(--accent);
        }

        button {
            padding: 0.85rem 1.5rem;
            background: var(--accent);
            color: var(--bg-color);
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Social links */
        .socials {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            font-size: 0.9rem;
        }

        .socials a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .socials a:hover {
            color: var(--accent);
        }

        footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            .countdown {
                grid-template-columns: repeat(2, 1fr);
            }
            form {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo & Presents Branding -->
        <div class="logo-container">&lt;/&gt;</div>
        <div class="presents">COLLINS WAWIRE PRESENTS</div>

        <!-- Dynamic Auto-Typing Heading -->
        <h1><span class="typed-text" id="typed"></span></h1>
        
        <p>Join the waitlist to get early beta access when we officially launch on March 27, 2027.</p>

        <!-- Live Countdown Timer -->
        <div class="countdown" id="countdown">
            <div class="time-box"><span id="days">00</span><label>Days</label></div>
            <div class="time-box"><span id="hours">00</span><label>Hours</label></div>
            <div class="time-box"><span id="minutes">00</span><label>Minutes</label></div>
            <div class="time-box"><span id="seconds">00</span><label>Seconds</label></div>
        </div>

        <!-- Signup Form configured for collinswawire060@gmail.com tracking -->
        <form id="waitlist-form" onsubmit="handleSignup(event)">
            <input type="email" id="email-input" placeholder="Enter your email address..." required>
            <button type="submit">Notify Me</button>
        </form>

        <!-- Social Media Links -->
        <div class="socials">
            <a href="https://github.com/mrofflinedev" target="_blank">GitHub</a>
            <a href="https://vercel.com" target="_blank">Vercel Deployment</a>
            <a href="#" target="_blank">Twitter / X</a>
        </div>
    </div>

    <footer>
        &copy; 2027 @mrofflinedev. All rights reserved.
    </footer>

    <script>
        // Auto-Typing Effect Logic
        const texts = [
            "Hi, am Collins alias mr offline dev",
            "Get ready for an epic experience with MR OFFLINE DEV",
            "Engineering next-gen offline-first web applications",
            "Get ready for new tech drops",
            "Collins wawire invites you all",
            "Time will be at 2pm EAT"
        ];
        
        let textIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const typedElement = document.getElementById("typed");

        function typeEffect() {
            const currentText = texts[textIndex];
            
            if (isDeleting) {
                typedElement.textContent = currentText.substring(0, charIndex - 1);
                charIndex--;
            } else {
                typedElement.textContent = currentText.substring(0, charIndex + 1);
                charIndex++;
            }

            let typeSpeed = isDeleting ? 40 : 80;

            if (!isDeleting && charIndex === currentText.length) {
                typeSpeed = 2000; // Pause at end of sentence
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                textIndex = (textIndex + 1) % texts.length;
                typeSpeed = 500; // Pause before typing next sentence
            }

            setTimeout(typeEffect, typeSpeed);
        }

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(typeEffect, 500);
        });

        // Countdown Timer Target: March 27, 2027, 00:00:00
        const launchDate = new Date("March 27, 2027 00:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = launchDate - now;

            if (distance < 0) {
                document.getElementById("countdown").innerHTML = "<h3>We Are Live!</h3>";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        function handleSignup(e) {
            e.preventDefault();
            const email = document.getElementById('email-input').value;
            // Target recipient note for collinswawire060@gmail.com
            alert(`Success! ${email} Thank you for signing up. You will be notified keep checking your email`);
            document.getElementById('email-input').value = '';
        }
    </script>
</body>
</html>
